name: OPS-01 protected production migration runner

on:
  # Merge of the reviewed waiver-aware runner to main automatically performs
  # a protected read-only preflight/dry-run. It never applies migrations.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose a dry run (default) or apply the exact OPS-01 migration set"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      confirmation:
        description: "For apply only, enter exactly: APPLY-OPS-01-TO-PRODUCTION"
        required: false
        type: string
      risk_acceptance_ref:
        description: "For apply only, paste the exact owner-approved DR-01 waiver record URL from PR #131."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-ops01-production-migrations
  cancel-in-progress: false

jobs:
  ops01:
    if: github.ref == 'refs/heads/main'
    name: "OPS-01 production migration ${{ inputs.operation || 'dry-run' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: nexus-production-migrations
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: txugbdavblpettcnhcxl
      OPS01_OPERATION: ${{ inputs.operation || 'dry-run' }}
      OPS01_CONFIRMATION: ${{ inputs.confirmation }}
      OPS01_RISK_ACCEPTANCE_REF: ${{ inputs.risk_acceptance_ref }}
    steps:
      - name: Check out reviewed main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact OPS-01 migration allowlist
        run: node scripts/ops01-migration-guard.mjs
      - name: Install pinned Supabase CLI v3.0.0
        run: npm install --global supabase@3.0.0
      - name: Verify operator secrets, immutable target and DR-01 risk acceptance
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$SUPABASE_PROJECT_REF" = "txugbdavblpettcnhcxl"
          if [[ "$OPS01_OPERATION" != "dry-run" && "$OPS01_OPERATION" != "apply" ]]; then
            echo "Unsupported operation." >&2
            exit 1
          fi
          if [[ "$OPS01_OPERATION" == "apply" ]]; then
            if [[ "$OPS01_CONFIRMATION" != "APPLY-OPS-01-TO-PRODUCTION" ]]; then
              echo "Apply requires the exact typed confirmation phrase." >&2
              exit 1
            fi
            node scripts/ops01-migration-guard.mjs \
              --require-risk-acceptance \
              --risk-acceptance-ref "$OPS01_RISK_ACCEPTANCE_REF"
            {
              echo "## OPS-01 DR-01 risk acceptance"
              echo ""
              echo "- Owner approval record: `$OPS01_RISK_ACCEPTANCE_REF`"
              echo "- DR-01 is waived in full. No production backup, isolated restore, or recovery-fidelity proof exists."
              echo "- The owner explicitly accepts the risk that current production workspace/Auth data may be irrecoverable after a damaging change."
              echo "- This owner record is risk acceptance, not backup/restore evidence. No NEXUS-DR evidence ID is claimed."
              echo "- The protected environment reviewer must inspect the owner record and approve the job under the configured environment protection rules."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          supabase --version
      - name: Build masked IPv4 session-pooler connection URL
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(node -e 'const u = new URL("postgresql://postgres.txugbdavblpettcnhcxl@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"); u.password = process.env.SUPABASE_DB_PASSWORD; process.stdout.write(u.toString())')"
          echo "::add-mask::$DB_URL"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Read production migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --remote="$SUPABASE_DB_URL" | tee "$RUNNER_TEMP/ops01-migrations-before.txt"
          node scripts/ops01-migration-guard.mjs --remote-file "$RUNNER_TEMP/ops01-migrations-before.txt"
      - name: Preview exact pending migration set (no database writes)
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run --remote="$SUPABASE_DB_URL" | tee "$RUNNER_TEMP/ops01-dry-run.txt"
          node scripts/ops01-migration-guard.mjs --remote-file "$RUNNER_TEMP/ops01-migrations-before.txt" --dry-run-file "$RUNNER_TEMP/ops01-dry-run.txt"
      - name: Apply reviewed OPS-01 migrations
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          # The only hosted write in this workflow. The protected GitHub
          # environment must have required reviewers configured before it is usable.
          supabase db push --yes --remote="$SUPABASE_DB_URL"
      - name: Verify migration history after apply
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --remote="$SUPABASE_DB_URL" | tee "$RUNNER_TEMP/ops01-migrations-after.txt"
          node scripts/ops01-migration-guard.mjs --remote-file "$RUNNER_TEMP/ops01-migrations-after.txt" --assert-complete
      - name: Verify production schema and default-off Delta state (read only)
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --file supabase/ops-01-post-migration-verification.sql --remote="$SUPABASE_DB_URL" --read-only --output json > "$RUNNER_TEMP/ops01-verification.json"
          cat "$RUNNER_TEMP/ops01-verification.json"
          node scripts/ops01-migration-guard.mjs --verify-file "$RUNNER_TEMP/ops01-verification.json"
      - name: Upload operator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops01-${{ inputs.operation }}-evidence
          path: |
            ${{ runner.temp }}/ops01-migrations-before.txt
            ${{ runner.temp }}/ops01-dry-run.txt
            ${{ runner.temp }}/ops01-migrations-after.txt
            ${{ runner.temp }}/ops01-verification.json
          if-no-files-found: ignore
          retention-days: 30
