name: Validate curriculum catalogue

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalogue and inline JavaScript syntax
        run: node scripts/validate-curricula.mjs
      - name: Test isolated preview configuration and build static output
        run: node scripts/test-preview-build-config.mjs && npm run build
      - name: Check and test backup, restore, and account-switch safety helpers
        run: node --check curriculum-integrity.js && node scripts/test-curriculum-integrity.mjs && node --check app-core.js && node --check study-hub.js && node --check offline-sync-queue.js && node --check backup-restore-utils.js && node --check cloud-sync-recovery.js && node --check workspace-sync-merge.js && node --check cloud-sync.js && node --check workspace-isolation-guard.js && node --check sw.js && node --check fsrs-bundle.js && node scripts/test-backup-restore.mjs && node scripts/test-offline-sync-queue.mjs && node scripts/test-workspace-sync-merge.mjs && node scripts/test-cloud-sync-recovery.mjs && node scripts/test-cloud-sync-runtime.mjs && node scripts/test-workspace-isolation-guard.mjs && node scripts/test-data-safety-wiring.mjs && node scripts/validate-security-headers.mjs && node scripts/test-regression.mjs && node scripts/test-service-worker.mjs
