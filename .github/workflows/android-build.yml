name: Android multi-store build

on:
  push:
    branches:
      - "android/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Build F-Droid and Google Play variants
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock-source/*.b64

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android-local web assets and sync native project
        env:
          NEXUS_ANDROID_CLOUD_MODE: staging
        run: npm run android:sync

      - name: Verify Android asset isolation and native feature wiring
        run: npm run test:android

      - name: Build debug APKs and unsigned release bundles
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace dependencies --configuration fdroidDebugRuntimeClasspath > /tmp/fdroid-dependencies.txt && ! grep -Eiq 'com[.]google[.]android[.]gms|com[.]google[.]firebase|firebase-analytics|play-services' /tmp/fdroid-dependencies.txt && ./gradlew --no-daemon --stacktrace --write-verification-metadata sha256 assembleFdroidDebug assemblePlayDebug assembleFdroidRelease bundleFdroidRelease bundlePlayRelease

      - name: Upload Android preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-release-validation
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/fdroid/debug/*.apk
            android/app/build/outputs/apk/play/debug/*.apk
            android/app/build/outputs/apk/fdroid/release/*.apk
            android/app/build/outputs/bundle/fdroidRelease/*.aab
            android/app/build/outputs/bundle/playRelease/*.aab
            android/gradle/verification-metadata.xml
