name: Active manifest staging race test

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  staging-race:
    if: >-
      github.event.pull_request.number == 126 &&
      github.event.pull_request.head.ref == 'android/capacitor-multistore-foundation' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-staging-race-test')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXUS_STAGING_DATABASE_URL: ${{ secrets.NEXUS_STAGING_DATABASE_URL }}
    steps:
      - name: Check out the exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Require the private staging connection secret
        run: |
          if [ -z "$NEXUS_STAGING_DATABASE_URL" ]; then
            echo "::error::Add the repository Actions secret NEXUS_STAGING_DATABASE_URL before triggering this test."
            exit 1
          fi
      - name: Run the two-session staging-only race test
        run: node scripts/test-active-manifest-race-staging.mjs
